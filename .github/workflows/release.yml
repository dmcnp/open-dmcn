name: release

# Tag-driven. `git tag v0.13.5 && git push origin v0.13.5` publishes both:
#   - cross-compiled binaries attached to the GitHub release
#   - a multi-arch container image at ghcr.io/dmcnp/open-dmcn
#
# Nothing here needs a secret beyond the automatic GITHUB_TOKEN.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and attach binaries
  packages: write # push to ghcr.io

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-release stamps the version from `git describe`, which needs full history
          # and the tags — a shallow clone silently produces binaries labelled "dev".
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The embedded SPA is committed, so this ships exactly what is in the tree — no Node
      # step, and no risk of the release differing from what a `go install` user gets.
      - run: make build-release

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    name: container image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The daemon, and the operator CLI as a separate image. Separate on purpose: they run
          # on different machines. dmcndcli holds the domain root key and belongs on your admin
          # machine, never on the node — shipping it inside the daemon image would invite the
          # habit the offline-root design exists to prevent.
          - image: open-dmcn
            dockerfile: Dockerfile
            suffix: ""
          - image: open-dmcn-cli
            dockerfile: Dockerfile.cli
            suffix: "-cli"
    steps:
      - uses: actions/checkout@v4

      # No QEMU. Both Dockerfiles pin their build stage to $BUILDPLATFORM and cross-compile with
      # GOOS/GOARCH, and neither runs anything on a target-platform stage — so arm64 is produced
      # by the amd64 runner's own toolchain rather than by emulating one.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
