<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Deliberately unbranded: the reference client is the daemon's webmail, not a
         product. The document title is refined client-side to the deployment's own
         domain once config loads (src/main.tsx) — a self-hoster's identity, not ours. -->
    <title>Mail</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14171A" />
    <meta name="description" content="End-to-end encrypted mail, decrypted in your browser." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mail" />

    <!-- Runtime config rendered by the Go backend (html/template). The nonce lets
         this inline script run under a strict, no-unsafe-inline script CSP. In raw
         vite dev the template placeholders aren't substituted; the frontend guards
         against that (see src/lib/config.ts). -->
    <script nonce="{{ .Nonce }}">
      const env = {
        NONCE: '{{ .Nonce }}',
        VERSION: '{{ .Version }}',
        DEFAULT_DOMAIN: '{{ .DefaultDomain }}',
        DEV_MODE: '{{ .DevMode }}',
        POLL_INTERVAL_MS: '{{ .PollIntervalMs }}',
        DOMAINS: '{{ .Domains }}',
        PETITION_MODE: '{{ .PetitionMode }}',
        DOMAIN_ROOT_PUB: '{{ .DomainRootPub }}',
      };
    </script>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #14171A; color: #333; }
    </style>
    <script type="module" crossorigin src="/assets/index-Bz4hwJw2.js" integrity="sha384-eSrZpbIfqJxRWaAjMCiUhD8nQ1wNfFHcucw9P/BWsZNixzAzXVLgViLfptjga843"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DkfnAOhu.css" integrity="sha384-VIKhgilqnAeAwbOWbogct94WgfZlQ96teoVvgWMmF7UCKJ0C/Y3DWjLsyDueapnP">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
